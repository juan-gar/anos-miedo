    --border-main:    #222222;

    --bg-nav:         #e8e2d8;
    --bg-nav-hover:   #dfd9cf;

    --bg-thesis:      #e5dfd5;

    --border-strong:  #b8b0a0;

  body {

  }

  .masthead {

    text-align: center;
    border-bottom: 1px solid var(--border-strong);
    overflow: hidden;
  }
  .masthead::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 39px, var(--grid-line) 39px, var(--grid-line) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, var(--grid-line) 39px, var(--grid-line) 40px);
    opacity: 0.4;
  }
  .masthead-inner { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }

  .series-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    display: inline-block;
    border: 1px solid var(--gold);
    padding: 0.25rem 0.75rem;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--ghost-title);   /* intentionally near-invisible */

  }
  h1 em { font-style: italic; color: var(--red); }  /* vivid subtitle word */

  .subtitle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-subtitle);
    margin-top: 1rem;
    margin-bottom: 0.4rem;
  }
  .author {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--text-author);
  }
  .tagline {
    margin-top: 2rem;
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ── THEME TOGGLE ── */
  .theme-toggle {
    position: absolute;
    top: 1.2rem;
    right: 1.2rem;
    z-index: 10;
    background: none;
    border: 1px solid var(--border-main);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .theme-toggle:hover { color: var(--text-primary); border-color: var(--text-muted); }
  .theme-toggle .icon { font-size: 0.8rem; }

  /* ── NAV STRIP ── */
  .nav-strip {
    display: flex;
    overflow-x: auto;
    border-bottom: 1px solid var(--border-main);
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-nav);
    transition: background 0.3s;
  }
  .nav-strip::-webkit-scrollbar { display: none; }

  .nav-btn {
    flex: none;
    background: none;
    border: none;
    border-right: 1px solid var(--border-main);
    color: var(--text-nav);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.9rem 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .nav-btn:hover { color: var(--text-primary); background: var(--bg-nav-hover); }
  .nav-btn.active {
    color: var(--gold);
    border-bottom: 2px solid var(--gold);
    background: var(--bg-nav-active);
  }

  /* ── MAIN ── */
  .main { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 6rem; }

  /* ── CHAPTER PANEL ── */
  .chapter-panel { display: none; animation: fadeSlide 0.4s ease; }
  .chapter-panel.active { display: block; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .chapter-header {
    padding: 3.5rem 0 2.5rem;
    border-bottom: 1px solid var(--border-main);
    position: relative;
  }
  .chapter-number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(5rem, 15vw, 9rem);
    font-weight: 900;
    font-style: italic;
    color: var(--ghost-numeral);
    line-height: 1;
    position: absolute;
    right: 0; top: 2rem;
    pointer-events: none;
    user-select: none;
  }
  .chapter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 0.8rem;
    display: block;
  }
  .chapter-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700;
    line-height: 1.15;
    color: var(--ghost-title);   /* ghost effect, same as h1 */
    max-width: 600px;
    position: relative; z-index: 1;
  }
  .chapter-epigraph {
    margin-top: 1.5rem;
    padding-left: 1.5rem;
    border-left: 2px solid var(--border-strong);
    font-style: italic;
    color: var(--text-muted);
    font-size: 0.85rem;
    line-height: 1.65;
    max-width: 480px;
    position: relative; z-index: 1;
  }
  .chapter-epigraph cite {
    display: block;
    font-style: normal;
    margin-top: 0.4rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-dimmest);
    text-transform: uppercase;
  }

  /* ── CONTENT BLOCKS ── */
  .chapter-body { padding: 2.5rem 0; display: grid; gap: 2rem; }

  .block-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .block-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-divider);
  }

  /* Central Argument */
  .thesis-box {
    background: var(--bg-thesis);
    border: 1px solid var(--red);
    padding: 1.5rem 2rem;
    position: relative;
  }
  .thesis-box::before {
    content: '▲';
    position: absolute;
    top: 1.2rem; right: 1.5rem;
    color: var(--red); font-size: 0.6rem;
  }
  .thesis-box p {
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text-thesis);
  }
  .thesis-box strong { color: var(--text-primary); }

  /* Summary */
  .summary-block {
    background: var(--bg-card);
    border: 1px solid var(--border-main);
    padding: 2rem;
  }
  .summary-text { font-size: 0.95rem; line-height: 1.85; color: var(--text-body); }
  .summary-text p + p { margin-top: 1rem; }
  .summary-text strong { color: var(--text-primary); font-weight: 700; }

  /* Key Concepts */
  .concepts-list { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
  .concept-item {
    display: grid;
    grid-template-columns: 1px 1fr;
    gap: 1rem;
    align-items: start;
  }
  .concept-line { width: 1px; height: 100%; background: var(--gold); margin-top: 0.25rem; }
  .concept-term {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    margin-bottom: 0.2rem;
  }
  .concept-def { font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }

  /* Key Figures */
  .figures-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1px;
    background: var(--bg-grid-gap);
    border: 1px solid var(--bg-grid-gap);
  }
  .figure-card { background: var(--bg-card); padding: 1.2rem; }
  .figure-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.3rem;
  }
  .figure-role {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 0.5rem;
  }
  .figure-desc { font-size: 0.78rem; line-height: 1.6; color: var(--text-dim); }

  /* Pagination */
  .pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 0;
    border-top: 1px solid var(--border-soft);
    margin-top: 1rem;
  }
  .page-btn {
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-dimmer);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.6rem 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .page-btn:hover:not(:disabled) { color: var(--text-primary); border-color: var(--text-muted); }
  .page-btn:disabled { opacity: 0.2; cursor: default; }
  .page-indicator {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--text-indicator);
    text-transform: uppercase;
  }

  footer {
    text-align: center;
    padding: 2rem;
    border-top: 1px solid var(--grid-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--text-footer);
    text-transform: uppercase;
  }

  @media (max-width: 600px) {
    .figures-grid { grid-template-columns: 1fr 1fr; }
    .summary-block { padding: 1.2rem; }
    .chapter-header { padding: 2.5rem 0 2rem; }
  }
</style>
</head>

// ── BUILD DOM ──
const navEl = document.getElementById('navStrip');
const chaptersEl = document.getElementById('chapters');
let current = 0;

chapters.forEach((ch, i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (i === 0 ? ' active' : '');
  btn.textContent = ch.label;
  btn.onclick = () => goTo(i);
  navEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'chapter-panel' + (i === 0 ? ' active' : '');
  panel.innerHTML = `
    <div class="chapter-header">
      <span class="chapter-label">${ch.label}</span>
      <h2 class="chapter-title">${ch.title}</h2>
      <div class="chapter-epigraph">
        <p>«${ch.epigraph.text}»</p>
        <cite>— ${ch.epigraph.author}</cite>
      </div>
      <div class="chapter-number">${ch.number}</div>
    </div>
    <div class="chapter-body">
      <div class="thesis-box">
        <div class="block-label">Argumento central</div>
        <p>${ch.thesis}</p>
      </div>
      <div class="summary-block">
        <div class="block-label">Resumen</div>
        <div class="summary-text">
          ${ch.summary.map(p => `<p>${p}</p>`).join('')}
        </div>
      </div>
      <div>
        <div class="block-label" style="margin-bottom:1rem">Conceptos clave</div>
        <ul class="concepts-list">
          ${ch.concepts.map(c => `
            <li class="concept-item">
              <div class="concept-line"></div>
              <div>
                <div class="concept-term">${c.term}</div>
                <div class="concept-def">${c.def}</div>
              </div>
            </li>`).join('')}
        </ul>
      </div>
      <div>
        <div class="block-label" style="margin-bottom:1rem">Personajes clave</div>
        <div class="figures-grid">
          ${ch.figures.map(f => `
            <div class="figure-card">
              <div class="figure-name">${f.name}</div>
              <div class="figure-role">${f.role}</div>
              <div class="figure-desc">${f.desc}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="pagination">
        <button class="page-btn" onclick="goTo(${i-1})" ${i===0?'disabled':''}>
          ← ${i>0 ? chapters[i-1].label : ''}
        </button>
        <span class="page-indicator">${i+1} / ${chapters.length}</span>
        <button class="page-btn" onclick="goTo(${i+1})" ${i===chapters.length-1?'disabled':''}>
          ${i<chapters.length-1 ? chapters[i+1].label : ''} →
        </button>
      </div>
    </div>`;
  chaptersEl.appendChild(panel);
});

// ── NAVIGATION ──
function goTo(idx) {
  if (idx < 0 || idx >= chapters.length) return;
  document.querySelectorAll('.chapter-panel').forEach((p, i) => p.classList.toggle('active', i===idx));
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i===idx));
  navEl.querySelectorAll('.nav-btn')[idx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  window.scrollTo({top:0, behavior:'smooth'});
  current = idx;
}

// ── THEME ──
let isDark = true;
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDark ? '☀' : '☾';
  document.getElementById('themeLabel').textContent = isDark ? 'Claro' : 'Oscuro';
}
document.documentElement.setAttribute('data-theme', 'dark');
</script>
</body>
